name: Build Gold Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
          with:
    packages: 'platform-tools'

      - name: Ekstrak proyek
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -1)
          mkdir -p /tmp/gold
          unzip "$ZIP" -d /tmp/gold
          PROJECT=$(find /tmp/gold -name settings.gradle | head -1)
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Siapkan APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" GoldTracker.apk

      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldTracker-APK
          path: GoldTracker.apk
